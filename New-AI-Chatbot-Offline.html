<body class="font-sans bg-gradient-to-br from-gray-900 to-black text-white h-screen overflow-hidden flex flex-col relative">
  
  <div id="file-modal" class="fixed inset-0 z-50 hidden bg-black/80 backdrop-blur-sm flex items-center justify-center p-6">

    </main>

    <div id="attachment-preview" class="hidden border-t border-white/10 bg-black/40 backdrop-blur-md px-6 py-2">

          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"></path></svg>

      <div class="max-w-4xl mx-auto px-6 py-4">

            <svg class="w-5 h-5 text-white/70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"></path></svg>

          <input type="file" id="file-upload" class="hidden" onchange="handleFileUpload(event)">

          <div class="flex-1">
            <textarea id="user-input" placeholder="Say something or ask about an attached file..." class="w-full px-4 py-3 bg-white/5 border border-white/20 rounded-xl text-white placeholder-white/50 resize-none focus:outline-none focus:ring-2 focus:ring-purple-400/50 transition-all disabled:opacity-50" style="min-height: 48px; max-height: 120px;" rows="1" onkeydown="handleKeyDown(event)" oninput="autoResize(this)"></textarea>

  <script>
    const OBFUSCATED_KEY = "c2NPbXlRQXAwck5ianpjRjFSM3NnSXdGUG04TkozaXNCeVNheklB";
    
    function getDecryptedKey() {
      return atob(OBFUSCATED_KEY).split('').reverse().join('');
    }

    const MODEL_NAME = 'gemini-2.5-flash';
    
    let messages = [
      {
        role: 'user',
        parts: [{ text: "System prompt: You are Dominium AI, a helpful assistant built by Dominus.elitus and ZXS. Be smart and minimalistic, but not too smart, and keep the conversation friendly." }]
      },
      {
        role: 'model',
        parts: [{ text: "Understood. I am Dominium AI. How can I assist you today?" }]
      }
    ];
    
    let isLoading = false;
    let messageIdCounter = 0;
    let codeBlocks = {};
    let blockCounter = 0;
    let currentAttachment = null;

    window.addEventListener('load', () => {
      const welcome = "Hello! I am Dominium AI. Join [discord.gg/dDqeTVfaYQ](https://discord.gg/dDqeTVfaYQ) for more quality content.";
      addMessage(welcome, 'assistant');
    });

    function handleFileUpload(e) {
      const file = e.target.files[0];
      if (!file) return;

      const isTextNode = file.type.startsWith('text/') || file.name.match(/\.(js|py|html|css|json|md|csv|xml)$/i);
      const reader = new FileReader();

      reader.onload = (ev) => {
        currentAttachment = {
          name: file.name,
          mimeType: file.type || 'text/plain',
          isText: isTextNode
        };

        if (isTextNode) {
          currentAttachment.textData = ev.target.result;
        } else {
          currentAttachment.data = ev.target.result.split(',')[1];
        }

        document.getElementById('attachment-preview').classList.remove('hidden');
        document.getElementById('attachment-name').textContent = file.name;
        document.getElementById('file-upload').value = '';
      };

      if (isTextNode) {
        reader.readAsText(file);
      } else {
        reader.readAsDataURL(file);
      }
    }

    function clearAttachment() {
      currentAttachment = null;
      document.getElementById('attachment-preview').classList.add('hidden');
    }

    async function sendMessage() {
      if (isLoading) return;

      const input = document.getElementById('user-input');
      const textMessage = input.value.trim();
      if (!textMessage && !currentAttachment) return;

      const parts = [];
      let displayMessage = textMessage;

      if (currentAttachment) {
        if (currentAttachment.isText) {
          parts.push({ text: `[Attached File: ${currentAttachment.name}]\n\`\`\`\n${currentAttachment.textData}\n\`\`\`\n\n${textMessage}` });
          displayMessage = `📎 *Attached: ${currentAttachment.name}*\n${textMessage}`;
        } else {
          parts.push({
            inlineData: {
              mimeType: currentAttachment.mimeType,
              data: currentAttachment.data
            }
          });
          if (textMessage) parts.push({ text: textMessage });
          displayMessage = `🖼️ *Attached: ${currentAttachment.name}*\n${textMessage}`;
        }
        clearAttachment();
      } else {
        parts.push({ text: textMessage });
      }

      addMessage(displayMessage, 'user');
      messages.push({ role: 'user', parts: parts });

      input.value = '';
      input.style.height = '48px';
      setLoading(true);
      const loadingId = addLoadingMessage();

      const payload = {
        contents: messages,
        generationConfig: { temperature: 0.7, maxOutputTokens: 2000 }
      };

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${getDecryptedKey()}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json();
        
        if (data.error) throw new Error(data.error.message);

        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "No response generated.";
        
        removeMessage(loadingId);
        addMessage(reply, 'assistant');
        messages.push({ role: 'model', parts: [{ text: reply }] });

      } catch (err) {
        removeMessage(loadingId);
        addMessage(`⚠️ **Error:** ${err.message}`, 'assistant');
        console.error(err);
      } finally {
        setLoading(false);
      }
    }

    function formatContent(text) {
      let formattedText = text;
      const placeholders = [];

      formattedText = formattedText.replace(/```(\w*)\n([\s\S]*?)```/g, (match, lang, code) => {
        const id = 'code-' + (++blockCounter);
        codeBlocks[id] = code.trim();
        const placeholder = `__BLOCK_${id}__`;
        placeholders.push({ placeholder, html: generateBlockHTML(id, lang, code.trim()) });
        return placeholder;
      });

      formattedText = formattedText.replace(/\*\*(.*?)\*\*/g, '<strong class="text-white">$1</strong>');
      formattedText = formattedText.replace(/`([^`\n]+)`/g, '<code class="bg-black/30 text-purple-200 px-1.5 py-0.5 rounded text-sm">$1</code>');
      formattedText = formattedText.replace(/\[([^\]]+)\]\((https?:\/\/[^\)]+)\)/g, '<a href="$2" target="_blank" class="text-purple-400 hover:text-purple-300 underline">$1</a>');
      formattedText = formattedText.replace(/\n/g, '<br>');

      placeholders.forEach(p => {
        formattedText = formattedText.replace(p.placeholder, p.html);
      });

      return formattedText;
    }

    function generateBlockHTML(id, lang, code) {
      const safeCode = code.replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const displayLang = lang || 'file';
      return `
        <div class="code-file-block relative group bg-black/50 border border-white/10 rounded-xl mt-3 mb-3 overflow-hidden shadow-lg">
          <div class="flex justify-between items-center px-4 py-2 bg-white/5 border-b border-white/10">
            <div class="flex items-center gap-2 text-white/50">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
              <span class="text-xs font-mono uppercase tracking-wider">${displayLang}</span>
            </div>
            <div class="opacity-0 group-hover:opacity-100 transition-opacity flex gap-2">
              <button onclick="viewFile('${id}', '${displayLang}')" class="text-xs bg-white/10 hover:bg-white/20 text-white px-3 py-1.5 rounded transition font-medium">View</button>
              <button onclick="copyCode('${id}')" class="text-xs bg-purple-600 hover:bg-purple-500 text-white px-3 py-1.5 rounded transition font-medium">Copy</button>
              <button onclick="downloadCode('${id}', '${displayLang}')" class="text-xs bg-white/10 hover:bg-white/20 text-white px-3 py-1.5 rounded transition font-medium flex items-center gap-1">
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg> Download
              </button>
            </div>
          </div>
          <div class="p-4 overflow-x-auto custom-scrollbar bg-[#0d0d12]">
            <pre class="m-0"><code class="text-sm text-gray-300 font-mono leading-relaxed">${safeCode}</code></pre>
          </div>
        </div>
      `;
    }

    function addMessage(content, role) {
      const container = document.getElementById('messages');
      const id = `msg-${++messageIdCounter}`;
      const wrap = document.createElement('div');
      wrap.id = id;
      wrap.className = `flex items-start gap-4 ${role === 'user' ? 'flex-row-reverse' : ''}`;
      
      const avatar = document.createElement('div');
      avatar.className = `w-10 h-10 rounded-full flex shrink-0 items-center justify-center font-bold text-sm shadow-lg ${
        role === 'user' ? 'bg-gradient-to-tr from-indigo-500 to-blue-600 text-white' : 'bg-gradient-to-tr from-purple-500 to-fuchsia-600 text-white'
      }`;
      avatar.textContent = role === 'user' ? 'U' : 'AI';
      
      const contentDiv = document.createElement('div');
      contentDiv.className = `w-full max-w-[85%] px-5 py-4 rounded-2xl leading-relaxed shadow-sm ${
        role === 'user'
          ? 'bg-white/10 border border-white/5 text-white rounded-tr-sm'
          : 'bg-black/40 border border-white/10 rounded-tl-sm'
      }`;
      
      contentDiv.innerHTML = formatContent(content);
      
      wrap.appendChild(avatar);
      wrap.appendChild(contentDiv);
      container.appendChild(wrap);
      scrollToBottom();
      return id;
    }

    function addLoadingMessage() {
      const container = document.getElementById('messages');
      const id = `loading-${++messageIdCounter}`;
      const wrap = document.createElement('div');
      wrap.id = id;
      wrap.className = 'flex items-start gap-4';
      
      const avatar = document.createElement('div');
      avatar.className = 'w-10 h-10 shrink-0 rounded-full bg-gradient-to-tr from-purple-500 to-fuchsia-600 text-white flex items-center justify-center text-sm font-bold shadow-lg';
      avatar.textContent = 'AI';
      
      const bubble = document.createElement('div');
      bubble.className = 'bg-black/40 border border-white/10 px-5 py-4 rounded-2xl rounded-tl-sm flex items-center h-[56px]';
      const dotsContainer = document.createElement('div');
      dotsContainer.className = 'flex items-center gap-1.5';
      
      for (let i = 0; i < 3; i++) {
        const dot = document.createElement('div');
        dot.className = 'w-2 h-2 bg-purple-400 rounded-full animate-bounce-dot';
        dot.style.animationDelay = `${i * 0.16}s`;
        dotsContainer.appendChild(dot);
      }
      
      bubble.appendChild(dotsContainer);
      wrap.appendChild(avatar);
      wrap.appendChild(bubble);
      container.appendChild(wrap);
      scrollToBottom();
      return id;
    }

    function removeMessage(id) {
      const el = document.getElementById(id);
      if (el) el.remove();
    }

    function setLoading(loading) {
      isLoading = loading;
      document.getElementById('send-button').disabled = loading;
      document.getElementById('user-input').disabled = loading;
      document.getElementById('send-button').textContent = loading ? 'Sending...' : 'Send';
    }

    function handleKeyDown(event) {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    }

    function autoResize(textarea) {
      textarea.style.height = '48px';
      textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
    }

    function scrollToBottom() {
      const container = document.getElementById('messages-container');
      container.scrollTop = container.scrollHeight;
    }

    function viewFile(id, lang) {
      const code = codeBlocks[id];
      document.getElementById('modal-title').textContent = `Viewing File (${lang || 'text'})`;
      document.getElementById('modal-code').textContent = code;
      document.getElementById('file-modal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('file-modal').classList.add('hidden');
    }

    function copyCode(id) {
      const code = codeBlocks[id];
      navigator.clipboard.writeText(code).then(() => {
        alert('Copied to clipboard!');
      }).catch(err => {
        console.error('Failed to copy text: ', err);
      });
    }

    function downloadCode(id, lang) {
      const code = codeBlocks[id];
      const extensions = { js: 'js', python: 'py', html: 'html', css: 'css', json: 'json', markdown: 'md' };
      const ext = extensions[lang?.toLowerCase()] || 'txt';
      
      const blob = new Blob([code], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `dominium_snippet.${ext}`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }
  </script>

</body></html>
